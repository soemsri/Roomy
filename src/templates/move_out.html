
<!DOCTYPE html>
<html lang="{{ lang or 'th' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ get_text('move_out_title', lang) }} - SukAnan Apartment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ef4444;
            --primary-dark: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h2 { margin: 0; font-size: 1.5rem; }
        .header p { margin: 10px 0 0; opacity: 0.9; font-size: 0.9rem; }
        
        .form-content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-dark); }
        .success-view {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .success-view i {
            font-size: 4rem;
            color: #22c55e;
            margin-bottom: 20px;
        }
        .info-box {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            color: #991b1b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2><i class="fa-solid fa-door-open"></i> {{ get_text('move_out_title', lang) }}</h2>
            <p>{{ get_text('move_out_subtitle', lang) }}</p>
        </div>
        <div class="form-content" id="formContent">
            <div class="info-box">
                <i class="fa-solid fa-circle-info"></i> {{ get_text('move_out_info', lang) }}
            </div>
            <form id="moveOutForm">
                <div class="form-group">
                    <label>{{ get_text('room_number_label', lang) }}</label>
                    <input type="text" value="{{ tenant.room.room_number if tenant.room else 'N/A' }}" disabled>
                </div>
                <div class="form-group">
                    <label>{{ get_text('tenant_name_label', lang) }}</label>
                    <input type="text" value="{{ tenant.full_name }}" disabled>
                </div>
                <div class="form-group">
                    <label>{{ get_text('move_out_date_label', lang) }}</label>
                    <input type="date" id="requested_date" required>
                </div>
                <div class="form-group">
                    <label>{{ get_text('move_out_reason_label', lang) }}</label>
                    <textarea id="reason" rows="3" placeholder="{{ get_text('move_out_reason_placeholder', lang) }}"></textarea>
                </div>
                <button type="submit" class="btn">{{ get_text('submit_move_out', lang) }}</button>
            </form>
        </div>
        <div class="success-view" id="successView">
            <i class="fa-solid fa-circle-check"></i>
            <h3>{{ get_text('move_out_success_title', lang) }}</h3>
            <p>{{ get_text('move_out_success_desc', lang) }}</p>
        </div>
    </div>

    <script>
        const tenant_uuid = "{{ tenant.uuid }}";

        document.getElementById('moveOutForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = '{{ get_text("sending_data", lang) }}';

            const data = {
                requested_date: document.getElementById('requested_date').value,
                reason: document.getElementById('reason').value
            };

            try {
                const res = await fetch(`/move-out/${tenant_uuid}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    document.getElementById('formContent').style.display = 'none';
                    document.getElementById('successView').style.display = 'block';
                } else {
                    const err = await res.json();
                    alert(err.detail || '{{ get_text("error_occurred", lang) }}');
                    btn.disabled = false;
                    btn.innerText = '{{ get_text("submit_move_out", lang) }}';
                }
            } catch (err) {
                alert('{{ get_text("connection_error", lang) }}');
                btn.disabled = false;
                btn.innerText = '{{ get_text("submit_move_out", lang) }}';
            }
        };
    </script>
</body>
</html>
